# Builds an installable APK and publishes it to a GitHub release. Added for
# this mirror so the app can be installed without an Android toolchain.
#
# Triggers:
#   - push to main, or manual run without a tag: artifact only
#   - manual run with a tag (e.g. v1.5.0): also creates/updates that release
#     and attaches the APK plus its SHA256
#
# The APK is signed with the debug key, because the release keystore lives in
# secrets that only the upstream repository has. Android installs it fine, but
# it cannot replace an F-Droid or upstream install (different signature).
name: Build APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to, e.g. v1.5.0 (leave empty for artifact only)'
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Must match the Flutter that made pubspec.lock (see flake.nix).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Build universal release APK
        run: flutter build apk --release --dart-define=STORE=fdroid

      - name: Collect artifact
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml)
          name="last-launcher-${version%%+*}-universal.apk"
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/$name"
          cd out && sha256sum "$name" > "$name.sha256"
          cat "$name.sha256"
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: last-launcher-apk
          path: out/
          if-no-files-found: error
          retention-days: 90

      - name: Publish release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *//p' pubspec.yaml)
          release="${TAG#v}"
          # Release notes are the version's section of CHANGELOG.md.
          awk -v v="## ${release%%-*}" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has nothing under '## ${release%%-*}'"; exit 1
          fi
          {
            cat notes.md
            echo
            echo "---"
            echo
            echo "APK: \`last-launcher-${version%%+*}-universal.apk\` (arm64-v8a, armeabi-v7a, x86_64)."
            echo "Signed with the debug key, so uninstall any F-Droid or upstream build before installing this one."
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* \
              --title "Last Launcher ${TAG#v}" \
              --notes-file notes.md
          fi
          gh release view "$TAG" --json url,assets
