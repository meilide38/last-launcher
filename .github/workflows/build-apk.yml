# Builds an installable APK on every push to main and on demand, and keeps it
# as a downloadable artifact. Added for this mirror so the app can be tried
# without an Android toolchain on your own machine.
#
# The APK is signed with the debug key, because the release keystore lives in
# secrets that only the upstream repository has. Android will install it, but
# it cannot replace an F-Droid or upstream install (different signature).
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Must match the Flutter that made pubspec.lock (see flake.nix).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Build universal release APK
        run: flutter build apk --release --dart-define=STORE=fdroid

      - name: Collect artifact
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml)
          name="last-launcher-${version%%+*}-universal.apk"
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/$name"
          cd out && sha256sum "$name" > "$name.sha256"
          cat "$name.sha256"
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: last-launcher-apk
          path: out/
          if-no-files-found: error
          retention-days: 90
